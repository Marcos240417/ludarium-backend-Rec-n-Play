<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludarium - Mensagens e Equipas</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <header class="main-navbar">
        <div class="nav-container">
            <span class="nav-brand">Ludarium Hub</span>
            <ul class="nav-links">
                <li><a href="http://127.0.0.1:8081/frontend/home.html">Projetos</a></li>
                <li><a href="http://127.0.0.1:8002/frontend/community.html">Comunidade</a></li>
                <li><a href="http://127.0.0.1:8003/frontend/campanhas.html">Campanhas</a></li>
                <li><a href="http://127.0.0.1:8002/frontend/chat.html" class="active">Mensagens</a></li>
                <li><a href="http://127.0.0.1:8004/frontend/perfil.html">Perfil</a></li>
            </ul>
        </div>
    </header>

    <main class="container" style="max-width: 1300px;">
        <div class="chat-layout">
            <!-- Sidebar de Conversas -->
            <div class="chat-sidebar">
                <div class="chat-sidebar-header">
                    <h3 style="color: white; margin: 0; font-size: 1.1rem;">💬 Mensagens & Equipas</h3>
                </div>
                <div style="padding: 0.75rem; border-bottom: 1px solid #2a2e43;">
                    <button class="btn-primary" style="width: 100%; font-size: 0.85rem; padding: 8px;" onclick="abrirModalNovaConversa()">+ Nova Mensagem Direta</button>
                </div>
                <div class="chat-list" id="lista-conversas">
                    <!-- Dinâmico -->
                </div>
            </div>

            <!-- Janela Principal de Chat -->
            <div class="chat-main" id="chat-janela-vazia" style="justify-content: center; align-items: center; color: #94a3b8;">
                <p>Selecione uma conversa ou grupo para começar a debater.</p>
            </div>

            <div class="chat-main" id="chat-janela-ativa" style="display: none;">
                <div class="chat-header" id="chat-titulo-ativo">Nome do Chat</div>
                <div class="chat-messages" id="chat-mensagens-container">
                    <!-- Mensagens -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="input-mensagem" placeholder="Escreva a sua mensagem..." onkeypress="verificarEnter(event)">
                    <button class="btn-primary" style="background: #7c3aed; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;" onclick="enviarMensagemAtual()">Enviar</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Nova Mensagem Direta -->
    <div id="modal-conversa" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;">
        <div class="modal-content" style="background: #1e293b; padding: 2rem; border-radius: 12px; width: 400px; border: 1px solid #334155;">
            <span class="close" onclick="fecharModalNovaConversa()" style="float: right; cursor: pointer; font-size: 1.5rem; color: #94a3b8;">&times;</span>
            <h3 style="color: white; margin-top: 0; margin-bottom: 1rem;">Nova Mensagem Direta</h3>
            <form onsubmit="iniciarConversaDireta(event)" style="display: flex; flex-direction: column; gap: 1rem;">
                <input type="email" id="novo-destinatario-email" placeholder="Email do destinatário (ex: user2@ludarium.com)" required style="padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white;">
                <textarea id="novo-conteudo-msg" placeholder="Escreva a mensagem..." rows="3" required style="padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; resize: vertical;"></textarea>
                <button type="submit" class="btn-primary" style="background: #7c3aed; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer;">Enviar Mensagem</button>
            </form>
        </div>
    </div>

    <!-- Script de Gestão de Tokens do Menu -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenUrl = urlParams.get('token');
            if (tokenUrl) {
                localStorage.setItem('ludarium_token', tokenUrl);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        })();

        document.addEventListener("DOMContentLoaded", () => {
            const linksMenu = document.querySelectorAll('.nav-links a');
            linksMenu.forEach(link => {
                link.addEventListener('click', (e) => {
                    const token = localStorage.getItem('ludarium_token') || localStorage.getItem('access_token');
                    if (token) {
                        e.preventDefault();
                        try {
                            const urlDestino = new URL(link.href);
                            urlDestino.searchParams.set('token', token);
                            window.location.href = urlDestino.toString();
                        } catch (err) {
                            window.location.href = link.href;
                        }
                    }
                });
            });
        });
    </script>
    <script src="chat.js"></script>
</body>
</html>
