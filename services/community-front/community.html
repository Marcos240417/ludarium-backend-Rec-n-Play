<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludarium - Comunidades</title>
    <link rel="stylesheet" href="community.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Ludarium</div>
        <nav>
            <a href="../home.frontend/index.html">Home</a>
            <a href="community.html" class="active">Comunidades</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero-section">
            <div class="hero-text">
                <h1>Comunidades de Desenvolvedores</h1>
                <p>Junte-se a grupos, troque ideias e encontre parceiros para os seus projetos indie.</p>
            </div>
            <button class="btn-primary" onclick="abrirModalPublicacao()">+ Nova Publicação</button>
        </section>

        <!-- Barra de Pesquisa e Filtros -->
        <div class="filter-container" style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <input type="text" id="input-pesquisa" placeholder="Pesquisar por título ou conteúdo..." oninput="filtrarPublicacoes()" style="flex: 1; background: #181b28; border: 1px solid #2a2e43; padding: 0.75rem 1rem; border-radius: 8px; color: white;">
            <select id="select-filtro-badge" onchange="filtrarPublicacoes()" style="background: #181b28; border: 1px solid #2a2e43; padding: 0.75rem; border-radius: 8px; color: white;">
                <option value="">Todas as Badges</option>
                <option value="PROCURANDO EQUIPE">PROCURANDO EQUIPE</option>
                <option value="PEDIDO DE FEEDBACK">PEDIDO DE FEEDBACK</option>
                <option value="DEVLOG">DEVLOG</option>
            </select>
        </div>

        <div class="content-layout">
            <!-- Feed Principal -->
            <div class="feed-container">
                <div id="loading" class="loading">A carregar publicações...</div>
                <div id="communities-grid" class="communities-grid"></div>
            </div>

            <!-- Sidebar com Oportunidades e Perfis -->
            <aside class="sidebar">
                <div class="sidebar-card">
                    <h3>🚀 Oportunidades Abertas</h3>
                    <div id="oportunidades-list">A carregar...</div>
                </div>
                <div class="sidebar-card">
                    <h3>👥 Perfis Recomendados</h3>
                    <div id="perfis-list">A carregar...</div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Modal para Criar Publicação -->
    <div id="modal-pub" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="fecharModalPublicacao()">&times;</span>
            <h2>Criar Nova Publicação</h2>
            <form id="form-nova-pub" onsubmit="criarPublicacao(event)">
                <input type="text" id="pub-titulo" placeholder="Título da publicação" required>
                <select id="pub-badge">
                    <option value="PROCURANDO EQUIPE">PROCURANDO EQUIPE</option>
                    <option value="PEDIDO DE FEEDBACK">PEDIDO DE FEEDBACK</option>
                    <option value="DEVLOG">DEVLOG</option>
                </select>
                <input type="text" id="pub-comunidade" placeholder="Nome da Comunidade (ex: Dev Indie Brasil)" required>
                <textarea id="pub-conteudo" placeholder="Escreva o conteúdo..." rows="4" required></textarea>
                <input type="text" id="pub-tags" placeholder="Tags separadas por vírgula (ex: godot, pixel art)">
                <button type="submit" class="btn-primary">Publicar</button>
            </form>
        </div>
    </div>

    <!-- Modal para Editar Publicação -->
    <div id="modal-editar" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="fecharModalEditar()">&times;</span>
            <h2>Editar Publicação</h2>
            <form id="form-editar-pub" onsubmit="salvarEdicaoPublicacao(event)">
                <input type="hidden" id="edit-pub-id">
                <input type="text" id="edit-pub-titulo" placeholder="Título" required>
                <select id="edit-pub-badge">
                    <option value="PROCURANDO EQUIPE">PROCURANDO EQUIPE</option>
                    <option value="PEDIDO DE FEEDBACK">PEDIDO DE FEEDBACK</option>
                    <option value="DEVLOG">DEVLOG</option>
                </select>
                <input type="text" id="edit-pub-comunidade" placeholder="Nome da Comunidade" required>
                <textarea id="edit-pub-conteudo" rows="4" required></textarea>
                <input type="text" id="edit-pub-tags" placeholder="Tags separadas por vírgula">
                <button type="submit" class="btn-primary">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script src="community.js"></script>
</body>
</html>
